<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Rutina - Strong Women Crossfit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background-color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
      border-bottom: 2px solid #ff4f9a;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .form-container {
      width: 420px;
      background-color: #1a1a1a;
      margin: 60px auto;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 79, 154, 0.3);
      text-align: center;
    }

    h2 {
      color: #ff4f9a;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 15px;
      text-align: left;
      font-weight: bold;
      color: #ddd;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: none;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: white;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      height: 80px;
    }

    .btn-add {
      background-color: #ff4f9a;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-add:hover {
      background-color: #e04385;
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="navbar-left">
      <img src="{{ url_for('static', filename='logo.jpg') }}" class="nav-logo">
      <h2>Strong Women Crossfit</h2>
    </div>
    <div class="navbar-right">
      <a href="{{ url_for('listar_rutinas') }}" class="btn-add">⬅ Volver</a>
    </div>
  </header>

  <main class="form-container">
    <h2>Nueva Rutina</h2>

    <form method="POST">
      <label>Nombre de la Rutina:</label>
      <input type="text" name="nombre" placeholder="Ej: CrossFit RX Lunes" required>

      <label>Día:</label>
      <select name="dia" required>
        <option value="">Seleccionar día</option>
        <option>Lunes</option>
        <option>Martes</option>
        <option>Miércoles</option>
        <option>Jueves</option>
        <option>Viernes</option>
        <option>Sábado</option>
      </select>

      <label>Nivel:</label>
      <select name="nivel" required>
        <option value="">Seleccionar nivel</option>
        <option>Amateur</option>
        <option>Scaled</option>
        <option>Advanced</option>
        <option>RX</option>
        <option>Competition</option>
      </select>

      <label>Descripción:</label>
      <textarea name="descripcion" placeholder="Ej: Calentamiento, WOD, Estiramiento..." required></textarea>

      <button type="submit" class="btn-add">Guardar Rutina</button>
    </form>
  </main>
</body>
</html>
