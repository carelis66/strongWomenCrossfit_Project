<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Plan</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="nav-logo">
      <h2>Strong Women Crossfit</h2>
    </div>
    <div class="navbar-right">
      <a href="{{ url_for('listar_planes') }}" class="logout-btn">Volver</a>
    </div>
  </header>

  <main class="form-container">
    <form method="POST" class="form-card">
      <h2>Editar Plan</h2>

      <label>Nombre:</label>
      <input type="text" name="nombre" value="{{ plan.nombre }}" required>

      <label>Precio:</label>
      <input type="number" step="0.01" name="precio" value="{{ plan.precio }}" required>

      <label>Nivel:</label>
      <input type="text" name="nivel" value="{{ plan.nivel }}" required>

      <label>Duración:</label>
      <input type="text" name="duracion" value="{{ plan.duracion }}" required>

      <label>Descripción:</label>
      <textarea name="descripcion" rows="3" required>{{ plan.descripcion }}</textarea>

      <button type="submit" class="btn-guardar">Guardar Cambios</button>
    </form>
  </main>
</body>
</html>
