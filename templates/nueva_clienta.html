<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Clienta - Strong Women Crossfit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* NAVBAR */
    .navbar {
      background-color: #000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 40px;
      border-bottom: 2px solid #ff4f9a;
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .navbar-right a {
      background-color: #ff4f9a;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .navbar-right a:hover {
      background-color: #e04385;
    }

    /* FORMULARIO */
    .form-container {
      width: 450px;
      background-color: #1a1a1a;
      margin: 60px auto;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 79, 154, 0.3);
      text-align: center;
      flex: 1;
    }

    h2 {
      color: #ff4f9a;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 15px;
      text-align: left;
      font-weight: bold;
      color: #ddd;
    }

    input[type="text"],
    input[type="number"],
    input[type="tel"],
    input[type="date"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: none;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: white;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #ff4f9a;
    }

    .btn-guardar {
      display: inline-block;
      background-color: #ff4f9a;
      color: white;
      font-weight: bold;
      text-decoration: none;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 25px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-guardar:hover {
      background-color: #e04385;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 20px;
      border-top: 2px solid #ff4f9a;
      background-color: #000;
      font-size: 14px;
      color: #999;
    }

    footer a {
      color: #ff4f9a;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-left">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="nav-logo">
      <h2>Strong Women Crossfit</h2>
    </div>
    <div class="navbar-right">
      <!-- ✅ Vuelve a la lista de clientas -->
      <a href="{{ url_for('listar_clientas') }}">⬅ Volver</a>
    </div>
  </header>

  <!-- FORMULARIO -->
  <main class="form-container">
    <form method="POST" class="form-card">
      <h2>Agregar Nueva Clienta</h2>

      <label>Nombre:</label>
      <input type="text" name="nombre" placeholder="Ingrese el nombre" required>

      <label>Apellido:</label>
      <input type="text" name="apellido" placeholder="Ingrese el apellido" required>

      <label>Edad:</label>
      <input type="number" name="edad" placeholder="Ingrese la edad" required>

      <label>Celular:</label>
      <input type="tel" name="celular" placeholder="Ej: 11 5555 6666" required>

      <label>Teléfono de Emergencia:</label>
      <input type="tel" name="emergencia" placeholder="Ej: 11 4444 7777" required>

      <label>Plan:</label>
      <input type="text" name="plan" placeholder="Ej: RX, Amateur, Scaled" required>

      <label>Fecha de Inscripción:</label>
      <input type="date" name="fecha" required>

      <button type="submit" class="btn-guardar">Guardar Clienta</button>
    </form>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>Panel de Recepción — Strong Women Crossfit © 2025 | 
      <a href="{{ url_for('recepcion') }}">Volver al Inicio</a>
    </p>
  </footer>
</body>
</html>
